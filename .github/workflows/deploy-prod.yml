name: Verify Production Image

on:
  workflow_run:
    workflows: ["Build and Publish Backend Image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build -f Dockerfile.prod.fix -t zynkronyx:production .

      - name: Module load smoke test
        run: |
          docker run --rm zynkronyx:production node -e "require('./src/app.production'); console.log('PRODUCTION_MODULE_LOAD_OK')"

      - name: Runtime smoke test
        run: |
          set -euxo pipefail
          docker rm -f zynkronyx-production-smoke >/dev/null 2>&1 || true
          docker run -d --init -p 3000:3000 --name zynkronyx-production-smoke \
            -e PORT=3000 \
            -e SYNC_PROCESSOR_ENABLED=false \
            zynkronyx:production
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Production container did not become healthy."
          docker ps -a --filter name=zynkronyx-production-smoke
          docker inspect zynkronyx-production-smoke --format '{{json .State}}' || true
          docker logs zynkronyx-production-smoke || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f zynkronyx-production-smoke || true

      - name: Deployment boundary
        run: |
          echo "Production image verified."
          echo "Persistent runtime deployment requires an externally configured hosting target."
