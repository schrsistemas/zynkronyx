name: Build and Publish Backend Image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile.prod"
      - "Dockerfile.prod.fix"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod.fix
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zynkronyx-backend:latest
            ghcr.io/${{ github.repository_owner }}/zynkronyx-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
