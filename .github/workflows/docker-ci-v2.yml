name: Zynkronyx Docker CI V2 (robusto)

on:
  push:
    branches: ["main"]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Dockerfile.prod -t zynkronyx:test .
      - name: Load production logger
        run: docker run --rm zynkronyx:test node -e "require('./src/utils/logger'); console.log('LOGGER_OK')"
      - name: Load database adapter
        run: docker run --rm zynkronyx:test node -e "require('./src/db/database'); console.log('DATABASE_OK')"
      - name: Load core routes
        run: |
          docker run --rm zynkronyx:test node -e "require('./src/routes/auth.basic'); console.log('AUTH_ROUTE_OK')"
          docker run --rm zynkronyx:test node -e "require('./src/routes/sync.routes'); console.log('SYNC_ROUTE_OK')"
          docker run --rm zynkronyx:test node -e "require('./src/routes/device.routes'); console.log('DEVICE_ROUTE_OK')"
      - name: Load AI provider
        run: docker run --rm zynkronyx:test node -e "require('./src/services/ai.provider'); console.log('AI_PROVIDER_OK')"
      - name: Load RAG service
        run: docker run --rm zynkronyx:test node -e "require('./src/services/rag.service'); console.log('RAG_SERVICE_OK')"
      - name: Load AI audit
        run: docker run --rm zynkronyx:test node -e "require('./src/services/ai.audit.service'); console.log('AI_AUDIT_OK')"
      - name: Load AI prompt
        run: docker run --rm zynkronyx:test node -e "require('./src/services/ai.prompt.service'); console.log('AI_PROMPT_OK')"
      - name: Load AI release
        run: docker run --rm zynkronyx:test node -e "require('./src/services/ai.release.service'); console.log('AI_RELEASE_OK')"
      - name: Load AI evaluation
        run: docker run --rm zynkronyx:test node -e "require('./src/services/ai.eval.service'); console.log('AI_EVAL_OK')"
      - name: Load AI service
        run: docker run --rm zynkronyx:test node -e "require('./src/services/ai.service'); console.log('AI_SERVICE_OK')"
      - name: Validate AI route registration
        run: docker run --rm zynkronyx:test node -e "const Module=require('module');const original=Module._load;const expressMock={Router(){const r={};for(const m of ['get','post','put','patch','delete'])r[m]=(...args)=>{for(const h of args.slice(1)){if(typeof h!=='function')throw new Error('INVALID_HANDLER:'+m+':'+typeof h);}return r;};return r;}};Module._load=function(req,p,isMain){if(req==='express')return expressMock;return original.apply(this,arguments)};try{require('./src/routes/ai.routes');console.log('AI_ROUTE_REGISTER_OK')}catch(e){console.error(e.stack);process.exit(1)}"
      - name: Load sales route
        run: docker run --rm zynkronyx:test node -e "require('./src/routes/sales.routes'); console.log('SALES_ROUTE_OK')"
      - name: Load fiscal route
        run: docker run --rm zynkronyx:test node -e "require('./src/routes/fiscal.routes'); console.log('FISCAL_ROUTE_OK')"
      - name: Load production app
        run: timeout 30s docker run --rm zynkronyx:test node -e "require('./src/app.production'); console.log('PRODUCTION_APP_OK')"
      - name: Run container
        run: |
          docker run -d -p 3000:3000 --name ztest             -e AUTH_LOGIN=ci             -e AUTH_PASSWORD=ci-password-123             -e AUTH_TOKEN=ci-token-0123456789-0123456789-012345             zynkronyx:test
      - name: Wait for API (retry)
        run: |
          for i in {1..20}; do
            echo "Tentativa $i..."
            curl -s http://localhost:3000/health && exit 0
            sleep 2
          done
          echo "API não respondeu"
          docker ps -a --filter name=ztest
          docker inspect ztest --format '{{json .State}}' || true
          docker logs ztest || true
          exit 1
      - name: Test endpoints
        run: |
          curl -f http://localhost:3000/health
          curl -f -X POST http://localhost:3000/auth/login -H "Content-Type: application/json" -d '{"login":"ci","password":"ci-password-123"}'
      - name: Logs (debug)
        if: failure()
        run: docker logs ztest
      - name: Cleanup
        if: always()
        run: |
          docker stop ztest || true
          docker rm ztest || true
