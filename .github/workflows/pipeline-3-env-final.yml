name: Zynkronyx Pipeline 3 Ambientes FINAL

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "database/**"
      - "Dockerfile.ci"
      - "Dockerfile.prod.fix"
      - ".github/workflows/pipeline-3-env-final.yml"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.ci -t zynkronyx:ci .
      - run: docker run -d -p 3000:3000 --name zci zynkronyx:ci
      - run: |
          for i in {1..20}; do
            curl -s http://localhost:3000/health && exit 0
            sleep 2
          done
          docker logs zci
          exit 1
      - run: curl -f http://localhost:3000/health

  staging:
    name: STAGING
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - run: docker build --no-cache -f Dockerfile.prod.fix -t zynkronyx:staging .
      - run: |
          docker run -d -p 3001:3000 --name zstaging zynkronyx:staging
      - run: |
          for i in {1..30}; do
            curl -s http://localhost:3001/health && exit 0
            sleep 2
          done
          docker logs zstaging
          exit 1
      - run: curl -f http://localhost:3001/health

  prod:
    name: PROD VERIFY
    runs-on: ubuntu-latest
    needs: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build production candidate
        run: docker build --no-cache -f Dockerfile.prod.fix -t zynkronyx:prod-candidate .
      - name: Verify production module
        run: |
          docker run --rm zynkronyx:prod-candidate             node -e "require('./src/app.production'); console.log('PRODUCTION_MODULE_LOAD_OK')"
      - name: Verify production container
        run: |
          set -euo pipefail
          docker run -d --init -p 3002:3000 --name zprod zynkronyx:prod-candidate
          for i in {1..30}; do
            if curl -fsS --max-time 3 http://localhost:3002/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs zprod
          exit 1
      - name: Production boundary
        run: |
          echo "Production candidate verified."
          echo "This workflow does not perform persistent production deployment."
          echo "Deployment requires an explicitly configured hosting target and a post-deploy verification."
      - name: Cleanup
        if: always()
        run: docker rm -f zprod zstaging zci >/dev/null 2>&1 || true
