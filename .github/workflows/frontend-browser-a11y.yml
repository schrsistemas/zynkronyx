name: Frontend Browser Accessibility QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-browser-a11y.yml"

permissions:
  contents: read

concurrency:
  group: frontend-browser-a11y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install application dependencies
        working-directory: frontend
        run: npm install

      - name: Build static Control Center
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://mute-grass-9428.schrsistemas.workers.dev
        run: npm run build

      - name: Install browser QA dependencies
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Serve static build
        working-directory: frontend
        run: |
          nohup npx --yes serve@14.2.5 out -l 4173 >/tmp/frontend-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/frontend-serve.log
          exit 1

      - name: Browser and accessibility contract
        working-directory: frontend
        env:
          FRONTEND_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
