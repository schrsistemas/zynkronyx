name: Deploy Control Center

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: frontend-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy Control Center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Build static Control Center
        working-directory: frontend
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          projects="$(npx wrangler pages project list --json)"
          if echo "$projects" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s).some(p=>p.name==="zynkronyx-control-center")?0:1))'; then
            echo "Cloudflare Pages project already exists."
          else
            echo "Creating Cloudflare Pages project..."
            npx wrangler pages project create zynkronyx-control-center --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy out --project-name zynkronyx-control-center

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2             https://zynkronyx-control-center.pages.dev/
