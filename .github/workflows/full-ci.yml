name: Zynkronyx FULL CI

on:
  push:
    branches: ["main", "release/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend deps
        run: |
          cd backend
          npm install
      - name: Start and test backend
        env:
          AUTH_LOGIN: ci
          AUTH_PASSWORD: ci-password-123
          AUTH_TOKEN: ci-token-0123456789-012345
        run: |
          cd backend
          node src/app.ci.js > /tmp/zynkronyx.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health
          response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -X POST http://localhost:3000/auth/login             -H "Content-Type: application/json"             -d '{"login":"ci","password":"ci-password-123"}')
          printf '%s\n' "$response"
          echo "$response" | grep -q 'HTTP_STATUS:200'
          echo "$response" | grep -q '"token"'
