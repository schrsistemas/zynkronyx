name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/zynkronyx-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/zynkronyx-worker
          command: deploy

      - name: Smoke test root version
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://mute-grass-9428.schrsistemas.workers.dev/health | grep '"version": "0.2.1"'

      - name: Smoke test health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://mute-grass-9428.schrsistemas.workers.dev/health

      - name: Smoke test status endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://mute-grass-9428.schrsistemas.workers.dev/api/status

      - name: Smoke test capabilities endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://mute-grass-9428.schrsistemas.workers.dev/api/capabilities
