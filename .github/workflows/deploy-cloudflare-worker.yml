name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/zynkronyx-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure backend gateway secret
        working-directory: cloudflare/zynkronyx-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_URL" || { echo "BACKEND_URL secret is required for the live API gateway."; exit 1; }
          printf '%s' "$BACKEND_URL" | npx wrangler@latest secret put BACKEND_URL

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/zynkronyx-worker
          command: deploy

      - name: Smoke test health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2             https://mute-grass-9428.schrsistemas.workers.dev/health | tee /tmp/health.json
          grep -q '"ok": true' /tmp/health.json
          grep -q '"service": "zynkronyx-gateway"' /tmp/health.json
          grep -q '"version":' /tmp/health.json
          grep -q '"backend": "configured"' /tmp/health.json

      - name: Smoke test CORS preflight
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 -X OPTIONS             -H 'Origin: https://zynkronyx-control-center.pages.dev'             -H 'Access-Control-Request-Method: GET'             -D /tmp/cors.headers -o /dev/null             https://mute-grass-9428.schrsistemas.workers.dev/health
          grep -qi '^access-control-allow-origin: https://zynkronyx-control-center.pages.dev' /tmp/cors.headers

      - name: Smoke test status endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2             https://mute-grass-9428.schrsistemas.workers.dev/api/status | tee /tmp/status.json
          grep -q '"backend": "configured"' /tmp/status.json

      - name: Smoke test backend readiness through gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2             https://mute-grass-9428.schrsistemas.workers.dev/ready

      - name: Smoke test capabilities endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2             https://mute-grass-9428.schrsistemas.workers.dev/api/capabilities
