name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/zynkronyx-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/zynkronyx-worker
          command: deploy

      - name: Configure backend secret when supplied
        if: ${{ secrets.BACKEND_URL != '' }}
        working-directory: cloudflare/zynkronyx-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: printf '%s' "$BACKEND_URL" | npx wrangler secret put BACKEND_URL

      - name: Smoke test gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://mute-grass-9428.schrsistemas.workers.dev/health

      - name: Smoke test CORS preflight
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X OPTIONS             -H 'Origin: https://zynkronyx-control-center.pages.dev'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: authorization,content-type,x-api-key,x-device-id,x-device-credential'             https://mute-grass-9428.schrsistemas.workers.dev/integration/events
