name: Zynkronyx Backend CI

on:
  push:
    branches: ["main", "release/**"]
    paths:
      - "backend/**"
      - "Dockerfile.prod"
      - "Dockerfile.prod.fix"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile.prod"
      - "Dockerfile.prod.fix"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend runtime tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: npm test

  docker:
    name: Backend Docker smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f Dockerfile.prod -t zynkronyx:backend-ci .
      - name: Start container
        run: docker run -d -p 3000:3000 --name zynkronyx-backend-ci -e SYNC_PROCESSOR_ENABLED=false zynkronyx:backend-ci
      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          docker logs zynkronyx-backend-ci
          exit 1
      - name: Validate public authentication entrypoint
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}'             -X POST http://localhost:3000/auth/login             -H "Content-Type: application/json"             -d '{"login":"ci","password":"ci-password"}')" = "503"
      - name: Validate readiness endpoint
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ready)" = "503"
      - name: Validate security headers
        run: |
          curl -fsSI http://localhost:3000/health | grep -qi '^x-content-type-options: nosniff'
          curl -fsSI http://localhost:3000/health | grep -qi '^x-frame-options: DENY'
          curl -fsSI http://localhost:3000/health | grep -qi '^x-correlation-id:' || true
      - name: Validate protected route
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}'             -H "x-api-key: ${CI_INVALID_API_KEY:-ci-invalid-key}"             http://localhost:3000/admin/status)" = "401"
      - name: Logs on failure
        if: failure()
        run: docker logs zynkronyx-backend-ci
      - name: Cleanup
        if: always()
        run: |
          docker stop zynkronyx-backend-ci || true
          docker rm zynkronyx-backend-ci || true
