services:
  firebird:
    image: firebirdsql/firebird:3.0.14-bookworm
    restart: unless-stopped
    environment:
      FIREBIRD_ROOT_PASSWORD: ${FIREBIRD_ROOT_PASSWORD:?set FIREBIRD_ROOT_PASSWORD}
      FIREBIRD_USER: ${DB_USER:-zynkronyx}
      FIREBIRD_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      FIREBIRD_DATABASE: ${FIREBIRD_DATABASE:-zynkronyx.fdb}
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    volumes:
      - firebird-data:/var/lib/firebird/data
    healthcheck:
      test: ["CMD-SHELL", "isql -user SYSDBA -password \"$${FIREBIRD_ROOT_PASSWORD}\" localhost:$${FIREBIRD_DATABASE} -q -ch UTF8 -input /dev/null >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ghcr.io/schrsistemas/zynkronyx-backend:latest
    restart: unless-stopped
    depends_on:
      firebird:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DRIVER: firebird
      DB_HOST: firebird
      DB_PORT: 3050
      DB_DATABASE: /var/lib/firebird/data/${FIREBIRD_DATABASE:-zynkronyx.fdb}
      DB_USER: ${DB_USER:-zynkronyx}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      TENANT_API_KEY: ${TENANT_API_KEY:?set TENANT_API_KEY}
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN}
      AUTH_LOGIN: ${AUTH_LOGIN:?set AUTH_LOGIN}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD}
      SYNC_PROCESSOR_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  firebird-data:
  caddy-data:
  caddy-config:
